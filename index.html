<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የምግብ ማዘዣ አፕሊኬሽን</title>
  
  <!-- 1. Telegram WebApp SDK (ከቴሌግራም ጋር ለመገናኘት) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* ==========================================
       1. መደበኛ የገጽ እና የዲዛይን ስታይሎች (CSS)
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f8f9fa;
      color: #333;
      padding-bottom: 120px; /* ከስር ላለው ባነር ቦታ መተው */
    }

    /* የላይኛው Tab Navigation (በምንም ተጽዕኖ የማይበላሽ fixed position) */
    .top-navbar {
      position: sticky;
      top: 0;
      background-color: #ffffff;
      display: flex;
      justify-content: space-around;
      padding: 15px 0;
      border-bottom: 1px solid #e0e0e0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      z-index: 100;
    }

    .tab-item {
      font-weight: 600;
      font-size: 15px;
      color: #666;
      cursor: pointer;
      padding-bottom: 5px;
    }

    .tab-item.active {
      color: #e67e22;
      border-bottom: 3px solid #e67e22;
    }

    .main-container {
      max-width: 500px;
      margin: 15px auto;
      padding: 15px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    h3 {
      margin-bottom: 12px;
      color: #2c3e50;
      font-size: 18px;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .menu-item:last-child {
      border-bottom: none;
    }

    /* ==========================================
       2. የጠረጴዛ መምረጫ እና የቀይ ኤረር/ዋርኒንግ ስታይል
       ========================================== */
    .table-section {
      transition: all 0.3s ease-in-out;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 15px;
      background-color: #ffffff;
    }

    /* ቀይ ዋርኒንግ በርቶ ሲቆይ የሚኖረው ስታይል */
    .table-section.has-error {
      border-color: #e74c3c !important;
      background-color: #fdf2f2;
      box-shadow: 0 0 10px rgba(231, 76, 60, 0.2);
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #34495e;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font-size: 16px;
      background-color: #fff;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: #3498db;
    }

    .error-msg {
      color: #c0392b;
      font-size: 13px;
      font-weight: bold;
      margin-top: 8px;
      display: none; /* መጀመሪያ አይታይም */
    }

    .btn-order {
      width: 100%;
      padding: 16px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 6px rgba(39, 174, 96, 0.2);
    }

    .btn-order:active {
      transform: scale(0.99);
    }

    /* ==========================================
       3. ከስር የሚወጣው Status Banner (Bottom Fixed)
       ========================================== */
    .bottom-banner-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      padding: 12px;
      pointer-events: none;
    }

    .status-banner {
      max-width: 500px;
      margin: 0 auto;
      padding: 14px 18px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      font-size: 15px;
      color: #ffffff;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.15);
      display: none;
      pointer-events: auto;
      transition: all 0.3s ease;
    }

    /* 🟡 1. SENDING (በመላክ ላይ) - የብጫ/ብርቱካን ከለር */
    .status-banner.sending {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #f39c12;
    }

    /* 🔵 2. PENDING (በመጠበቅ ላይ) - የሰማያዊ ከለር */
    .status-banner.pending {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #2980b9;
    }

    /* 🟢 3. ACCEPTED (ተቀብሎታል) - የአረንጓዴ ከለር */
    .status-banner.accepted {
      display: block;
      background-color: #27ae60;
    }

    /* 🔴 4. ERROR (ስህተት ከተፈጠረ) - የቀይ ከለር */
    .status-banner.error {
      display: block;
      background-color: #c0392b;
    }

    /* የሽክርክሪት (Loading Spinner) አኒሜሽን */
    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- የላይኛው Tabs (ከስር የሚወጣው ባነር ምንም ተጽዕኖ አያደርስበትም) -->
  <div class="top-navbar">
    <div class="tab-item active">የምግብ ዝርዝር</div>
    <div class="tab-item">ትዕዛዞቼ</div>
    <div class="tab-item">እርዳታ</div>
  </div>

  <div class="main-container">
    
    <!-- የምግብ ዝርዝር ክፍል -->
    <div class="card">
      <h3>📜 ሜኑ</h3>
      <div class="menu-item">
        <span>special Burger</span>
        <strong>350 ብር</strong>
      </div>
      <div class="menu-item">
        <span>Pizza Large</span>
        <strong>550 ብር</strong>
      </div>
      <div class="menu-item">
        <span>Soft Drink</span>
        <strong>50 ብር</strong>
      </div>
    </div>

    <!-- ረጅም ገጽ ለማስመሰል የተደረገ ክፍተት (Scroll መደረጉ እንዲታወቅ) -->
    <div style="height: 250px; display: flex; align-items: center; justify-content: center; color: #aaa;">
      👇 እባክዎ ወደ ታች ወርደው ጠረጴዛ ይምረጡ
    </div>

    <!-- የጠረጴዛ መምረጫ ክፍል -->
    <div class="card table-section" id="tableSection">
      <label for="tableSelect">🪑 እባክዎ ቅድሚያ የጠረጴዛ/ወንበር ቁጥር ይምረጡ፡</label>
      <select id="tableSelect">
        <option value="">-- ጠረጴዛ ቁጥር ይምረጡ --</option>
        <option value="1">ጠረጴዛ ቁጥር 1</option>
        <option value="2">ጠረጴዛ ቁጥር 2</option>
        <option value="3">ጠረጴዛ ቁጥር 3</option>
        <option value="4">ጠረጴዛ ቁጥር 4</option>
      </select>
      <div class="error-msg" id="errorMsg">⚠️ እባክዎ አስቀድመው የጠረጴዛ ቁጥር ይምረጡ!</div>
    </div>

    <!-- ትዕዛዝ መላኪያ ቁልፍ -->
    <button class="btn-order" onclick="handleOrderSubmit()">ትዕዛዝ ላክ</button>
  </div>

  <!-- ከስር የሚወጣው ሁኔታ ማሳወቂያ ባነር (Bottom Banner) -->
  <div class="bottom-banner-wrapper">
    <div id="statusBanner" class="status-banner"></div>
  </div>

  <!-- ==========================================
     4. የጃቫስክሪፕት (JS) ሙሉ Logic
     ========================================== -->
  <script>
    // 1. Telegram WebApp ን ማዘጋጀት (ከቴሌግራም ከተከፈተ)
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand(); // ገጹን ሙሉ ስክሪን ማድረግ
    }

    const tableSelect = document.getElementById('tableSelect');
    const tableSection = document.getElementById('tableSection');
    const errorMsg = document.getElementById('errorMsg');
    const statusBanner = document.getElementById('statusBanner');

    // 2. ተጠቃሚው ጠረጴዛ መምረጥ ሲጀምር የቀይ ዋርኒንግ ምልክቱን ወዲያውኑ ማጥፋት
    tableSelect.addEventListener('change', function() {
      if (this.value !== "") {
        tableSection.classList.remove('has-error');
        errorMsg.style.display = 'none';
      }
    });

    // 3. ትዕዛዝ መላክ ሲነካ የሚሰራ ዋና Logic
    function handleOrderSubmit() {
      
      // ሀ. ጠረጴዛ ካልተመረጠ -> Auto-Scroll ገፍቶ መወሰድ እና የቀይ ኤረር ማብራት
      if (tableSelect.value === "") {
        tableSection.classList.add('has-error');
        errorMsg.style.display = 'block';

        // ገጹን ወዲያውኑ ወደ ጠረጴዛ መምረጫው ቦታ ገፍቶ (Smooth Scroll) ይወስደዋል
        tableSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      // ለ. ደረጃ 1፡ 🟡 SENDING (በመላክ ላይ - ብጫ/ብርቱካን ከለር ከሎዲንግ ጋር)
      showBanner('sending', '<div class="spinner"></div> ትዛዙ በመላክ ላይ ነው...');

      // ወደ ሰርቨር መላክን ለመምሰል (Network call simulation)
      setTimeout(() => {
        
        // ሐ. ደረጃ 2፡ 🔵 PENDING (በመጠበቅ ላይ - ሰማያዊ ከለር ከሎዲንግ ጋር)
        showBanner('pending', '<div class="spinner"></div> ትዛዙ በተሳካ ሁኔታ ተልኳል! ኩሽናው እስኪቀበል በመጠበቅ ላይ...');

        // ቴሌግራም ላይ ቦቱ/ኩሽናው "Accept Order" ሲነካ የሚፈጠረው ሂደት (ምሳሌ፡ ከ 4 ሰከንድ በኋላ)
        setTimeout(() => {
          
          // መ. ደረጃ 3፡ 🟢 ACCEPTED (ትዕዛዙ ተቀብሏል - አረንጓዴ ከለር)
          showBanner('accepted', '✅ ኩሽናው ትዕዛዝዎን በተሳካ ሁኔታ ተቀብሎታል!');

        }, 4000); // ኩሽናው Accept አድርጎ መልስ ሲልከው የሚቀየር

      }, 1500);
    }

    // የባነሩን ሁኔታ (Status) እና ከለር መቀየሪያ ተግባር
    function showBanner(statusClass, messageHTML) {
      statusBanner.className = `status-banner ${statusClass}`;
      statusBanner.innerHTML = messageHTML;
    }
  </script>
</body>
</html>
